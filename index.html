<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bubble Arcade Pop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0f19;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 街機主機外框容器 */
    .arcade-cabinet {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 900px;
      max-height: 94vh;
      background: #151a2d;
      border: 8px solid #283353;
      border-radius: 24px;
      box-shadow: 0 0 35px rgba(34, 211, 238, 0.25), inset 0 0 15px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 街機螢幕掃描線與 CRT 弧光特效 */
    .crt-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      z-index: 20;
    }

    /* 頂部 HUD 計分板 */
    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(10, 14, 26, 0.85);
      border-bottom: 3px solid #22d3ee;
      z-index: 15;
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.8);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-val {
      color: #facc15;
    }

    /* 畫布容器 */
    .screen-area {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 覆蓋層選單 (開始 / 結束) */
    .overlay-modal {
      position: absolute;
      inset: 0;
      background: rgba(8, 12, 22, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 30;
      transition: opacity 0.25s ease;
    }

    .overlay-modal.hidden {
      display: none;
    }

    .game-title {
      font-size: 26px;
      color: #38bdf8;
      line-height: 1.5;
      text-shadow: 3px 3px 0px #be185d, 0 0 20px #38bdf8;
      margin-bottom: 20px;
      animation: pulseTitle 1.5s infinite alternate;
    }

    @keyframes pulseTitle {
      from { transform: scale(1); filter: drop-shadow(0 0 5px #38bdf8); }
      to { transform: scale(1.04); filter: drop-shadow(0 0 16px #facc15); }
    }

    .arcade-btn {
      font-family: 'Press Start 2P', monospace;
      margin-top: 25px;
      padding: 16px 28px;
      font-size: 14px;
      color: #0d1322;
      background: #facc15;
      border: 4px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 0 #ca8a04, 0 10px 18px rgba(250, 204, 21, 0.4);
      transition: all 0.1s ease;
    }

    .arcade-btn:hover {
      background: #fde047;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #ca8a04, 0 12px 22px rgba(250, 204, 21, 0.6);
    }

    .arcade-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #ca8a04;
    }

    .guide-text {
      font-size: 11px;
      line-height: 1.8;
      color: #94a3b8;
      max-width: 480px;
      margin: 12px 0;
    }

    .combo-badge {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 15px;
      color: #f43f5e;
      text-shadow: 0 0 10px rgba(244, 63, 94, 0.8);
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
    }

    .combo-badge.active {
      opacity: 1;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- 街機框體 -->
  <div class="arcade-cabinet">
    <div class="crt-overlay"></div>

    <!-- 頂端儀表板 -->
    <div class="hud-bar">
      <div class="hud-item">SCORE: <span id="scoreVal" class="hud-val">0000</span></div>
      <div class="hud-item">HI-SCORE: <span id="hiScoreVal" class="hud-val">0000</span></div>
      <div class="hud-item">TIME: <span id="timerVal" class="hud-val">45</span>s</div>
    </div>

    <!-- 遊戲主體繪圖區域 -->
    <div class="screen-area" id="screenArea">
      <canvas id="gameCanvas"></canvas>
      <div id="comboBadge" class="combo-badge">COMBO x2!</div>

      <!-- 開始選單 -->
      <div id="startScreen" class="overlay-modal">
        <h1 class="game-title">BUBBLE<br>POPPER</h1>
        <p class="guide-text">★ 點擊向上飄浮的泡泡獲得分數 ★</p>
        <p class="guide-text" style="color: #38bdf8;">每顆泡泡左上有亮點，右上有金黃星星！連續戳破可啟動連擊 COMBO 獎勵！</p>
        <button id="startBtn" class="arcade-btn">PRESS START</button>
      </div>

      <!-- 遊戲結束結算選單 -->
      <div id="gameOverScreen" class="overlay-modal hidden">
        <h1 class="game-title" style="color: #f43f5e;">TIME UP!</h1>
        <p class="guide-text" style="font-size: 13px;">FINAL SCORE</p>
        <h2 id="finalScore" style="font-size: 24px; color: #facc15; margin: 10px 0 20px;">0</h2>
        <p id="newHiScoreMsg" class="guide-text" style="color: #4ade80; display: none;">★ NEW HIGH SCORE! ★</p>
        <button id="restartBtn" class="arcade-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script>
    // 使用 Web Audio API 即時合成 8-bit 街機音效（無需任何外部音樂檔案）
    class SoundSynth {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playPop(frequency = 520) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, now);
        osc.frequency.exponentialRampToValueAtTime(frequency * 1.8, now + 0.08);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.08);
      }

      playStarChime(combo = 1) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        const baseFreq = 880 + Math.min(combo * 90, 800);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.2, now + 0.12);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.15);
      }
    }

    const sound = new SoundSynth();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const screenArea = document.getElementById('screenArea');

    const scoreVal = document.getElementById('scoreVal');
    const hiScoreVal = document.getElementById('hiScoreVal');
    const timerVal = document.getElementById('timerVal');
    const comboBadge = document.getElementById('comboBadge');

    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const finalScore = document.getElementById('finalScore');
    const newHiScoreMsg = document.getElementById('newHiScoreMsg');

    let width = 0;
    let height = 0;
    let score = 0;
    let hiScore = localStorage.getItem('bubble_hi_score') || 0;
    let timeLeft = 45;
    let gameTimer = null;
    let isPlaying = false;

    let combo = 0;
    let lastPopTime = 0;

    hiScoreVal.textContent = String(hiScore).padStart(4, '0');

    function resize() {
      width = screenArea.clientWidth;
      height = screenArea.clientHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);

    // 五角星形路徑繪製
    function drawStar(context, cx, cy, spikes, outerRadius, innerRadius, color) {
      let rot = (Math.PI / 2) * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;

      context.beginPath();
      context.moveTo(cx, cy - outerRadius);

      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        context.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        context.lineTo(x, y);
        rot += step;
      }
      context.lineTo(cx, cy - outerRadius);
      context.closePath();
      context.fillStyle = color;
      context.shadowColor = '#facc15';
      context.shadowBlur = 10;
      context.fill();
      context.shadowBlur = 0; // 重置陰影
    }

    // 戳破後的漂浮分數文字
    class FloatingText {
      constructor(x, y, text, color = '#facc15') {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 1.0;
        this.speedY = 1.2;
      }
      update() {
        this.y -= this.speedY;
        this.life -= 0.025;
      }
      draw() {
        ctx.save();
        ctx.font = '12px "Press Start 2P", monospace';
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillText(this.text, this.x - 20, this.y);
        ctx.restore();
      }
    }

    // 戳破產生的亮片火花粒子
    class SparkParticle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 4 + 2;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.08; // 輕微重力
        this.life -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.restore();
      }
    }

    class GameBubble {
      constructor() {
        this.init(true);
      }

      init(initial = false) {
        this.radius = Math.random() * 18 + 22; // 半徑 22 ~ 40px
        this.x = Math.random() * (width - this.radius * 2) + this.radius;
        this.y = initial ? Math.random() * height : height + this.radius + Math.random() * 80;
        this.speedY = Math.random() * 1.6 + 1.2;
        this.driftX = (Math.random() - 0.5) * 0.7;
        this.wobbleSpeed = Math.random() * 0.04 + 0.02;
        this.wobbleAngle = Math.random() * Math.PI * 2;
        this.alpha = Math.random() * 0.25 + 0.45;

        // 泡泡顏色（霓虹藍、紫、青）
        const hues = [185, 205, 260, 290];
        this.hue = hues[Math.floor(Math.random() * hues.length)];
        this.color = `hsla(${this.hue}, 85%, 65%, ${this.alpha})`;

        // 左上方小白方塊
        this.squareSize = this.radius * 0.26;

        // 右上方黃色星星
        this.starOuterRadius = this.radius * 0.35;
        this.starInnerRadius = this.starOuterRadius * 0.5;

        // 星星點綴微閃爍
        this.starAngle = -Math.PI / 4;
      }

      update() {
        this.y -= this.speedY;
        this.wobbleAngle += this.wobbleSpeed;
        this.x += this.driftX + Math.sin(this.wobbleAngle) * 0.5;

        // 超出頂部邊界重置到底部
        if (this.y + this.radius < -20) {
          this.init(false);
        }
      }

      draw() {
        ctx.save();

        // 1. 繪製主體圓形
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();

        // 柔和的邊緣光暈
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = `hsla(${this.hue}, 100%, 80%, 0.7)`;
        ctx.stroke();
        ctx.closePath();

        // 2. 圓的「左上方」白色小方塊
        const squareOffset = this.radius * 0.46;
        const sqX = this.x - squareOffset - (this.squareSize / 2);
        const sqY = this.y - squareOffset - (this.squareSize / 2);

        ctx.beginPath();
        ctx.rect(sqX, sqY, this.squareSize, this.squareSize);
        ctx.fillStyle = `rgba(255, 255, 255, 0.85)`;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.closePath();

        // 3. 圓的「右上方」黃色小星星
        const starDist = this.radius * 0.96;
        const starX = this.x + Math.cos(this.starAngle) * starDist;
        const starY = this.y + Math.sin(this.starAngle) * starDist;

        drawStar(ctx, starX, starY, 5, this.starOuterRadius, this.starInnerRadius, '#FFD13B');

        ctx.restore();
      }

      isHit(px, py) {
        // 判定點擊範圍（略放大判定半徑，手感更好）
        const dx = px - this.x;
        const dy = py - this.y;
        return (dx * dx + dy * dy) <= (this.radius * 1.2) * (this.radius * 1.2);
      }
    }

    let bubbles = [];
    let particles = [];
    let floatingTexts = [];

    function setupBubbles(count = 16) {
      bubbles = [];
      for (let i = 0; i < count; i++) {
        bubbles.push(new GameBubble());
      }
    }

    function popBubble(bubble, index) {
      const now = performance.now();
      if (now - lastPopTime < 1100) {
        combo++;
      } else {
        combo = 1;
      }
      lastPopTime = now;

      // 計分系統
      const basePoints = 100;
      const bonus = (combo - 1) * 50;
      const earned = basePoints + bonus;
      score += earned;
      scoreVal.textContent = String(score).padStart(4, '0');

      // 觸發音效
      sound.playPop(450 + Math.min(combo * 60, 600));
      sound.playStarChime(combo);

      // 產生星塵與方塊碎片
      for (let i = 0; i < 14; i++) {
        const pColor = i % 2 === 0 ? '#facc15' : '#38bdf8';
        particles.push(new SparkParticle(bubble.x, bubble.y, pColor));
      }

      // 顯示分數飄字
      const popLabel = combo > 1 ? `+${earned} x${combo}` : `+${earned}`;
      floatingTexts.push(new FloatingText(bubble.x, bubble.y, popLabel, combo > 1 ? '#f43f5e' : '#facc15'));

      // 顯示連擊徽章
      if (combo >= 2) {
        comboBadge.textContent = `COMBO x${combo}!`;
        comboBadge.classList.add('active');
      }

      // 重生該泡泡
      bubble.init(false);
    }

    // 點擊與觸控偵測
    function handlePointer(event) {
      if (!isPlaying) return;

      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;

      if (event.touches && event.touches.length > 0) {
        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;
      } else {
        clientX = event.clientX;
        clientY = event.clientY;
      }

      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      let hit = false;
      // 從最上層倒序檢查被點到的泡泡
      for (let i = bubbles.length - 1; i >= 0; i--) {
        if (bubbles[i].isHit(clickX, clickY)) {
          popBubble(bubbles[i], i);
          hit = true;
          break;
        }
      }
    }

    canvas.addEventListener('mousedown', handlePointer);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handlePointer(e);
    }, { passive: false });

    function startGame() {
      sound.init();
      resize();
      score = 0;
      timeLeft = 45;
      combo = 0;
      scoreVal.textContent = '0000';
      timerVal.textContent = timeLeft;
      comboBadge.classList.remove('active');

      particles = [];
      floatingTexts = [];
      setupBubbles(18);

      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      newHiScoreMsg.style.display = 'none';

      isPlaying = true;

      clearInterval(gameTimer);
      gameTimer = setInterval(() => {
        timeLeft--;
        timerVal.textContent = timeLeft;

        // 超過 1.5 秒無點擊重置連擊
        if (performance.now() - lastPopTime > 1500 && combo > 0) {
          combo = 0;
          comboBadge.classList.remove('active');
        }

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(gameTimer);
      comboBadge.classList.remove('active');

      finalScore.textContent = score;

      if (score > hiScore) {
        hiScore = score;
        localStorage.setItem('bubble_hi_score', hiScore);
        hiScoreVal.textContent = String(hiScore).padStart(4, '0');
        newHiScoreMsg.style.display = 'block';
      }

      gameOverScreen.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // 主繪圖迴圈
    function gameLoop() {
      // 復古街機漸層背景深色洗底
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, width, height);

      // 繪製背景裝飾性小星光
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      for (let i = 0; i < 20; i++) {
        const starDotX = (i * 97) % (width || 1);
        const starDotY = (i * 137) % (height || 1);
        ctx.fillRect(starDotX, starDotY, 2, 2);
      }

      // 更新與繪製泡泡
      for (let bubble of bubbles) {
        if (isPlaying) bubble.update();
        bubble.draw();
      }

      // 更新與繪製爆破粒子
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      // 更新與繪製浮動文字
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        floatingTexts[i].update();
        floatingTexts[i].draw();
        if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
      }

      requestAnimationFrame(gameLoop);
    }

    // 啟動初始化
    resize();
    setupBubbles(14);
    gameLoop();
  </script>
</body>
</html>
